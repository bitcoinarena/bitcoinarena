<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Feedback review &middot; Bug bounty by week</title>
<!-- kanban #1342 section 4: the owner's review list of player feedback. Every call carries the admin code (x-arena-admin), checked by the faucet
     against its hash; the code is kept in this browser only. A player's words are a stranger's text: only ever set with textContent. -->
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --dim: #8b949e; --btc: #f7931a; --ok: #3fb950; --bad: #f85149; --warn: #d29922; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; padding: 24px 16px 56px; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 18px 0 8px; }
  .sub { color: var(--dim); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, textarea, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  button { cursor: pointer; background: #21262d; font-weight: 600; } button.go { background: var(--btc); color: #1a1000; border-color: var(--btc); }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; margin: 6px 0; } .bar > i { display: block; height: 100%; background: var(--btc); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; } .stat span { color: var(--dim); font-size: 13px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-size: 13px; font-weight: 600; } tr.pick { cursor: pointer; } tr.pick:hover { background: #1c2330; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .s-new { color: var(--btc); } .s-accepted { color: var(--ok); } .s-paid { color: var(--ok); } .s-rejected { color: var(--bad); } .s-duplicate { color: var(--dim); }
  .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--dim); }
  pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0; font: inherit; }
  code { font-size: 12px; word-break: break-all; }
  #say { min-height: 1.4em; margin: 8px 0; }
  @media (max-width: 640px) { .hide-s { display: none; } }
.nb-tiles{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.nb-tile{border:1px solid #30363d;border-radius:10px;padding:8px 12px;min-width:110px}.nb-tile b{display:block;font-size:20px}.nb-tile span{font-size:12px;color:#8b949e}.nb-tile.ok{border-color:#2ea04366}.nb-tile.no{border-color:#f8514966}
.nb-days{display:flex;gap:4px;margin:4px 0 8px}.nb-day{width:18px;height:18px;border-radius:4px;background:#30363d}.nb-day.on{background:#3fb950}
.nb-badges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.nb-badge{border-radius:999px;padding:3px 10px;font-size:12.5px;border:1px solid #30363d}.nb-badge.ok{color:#3fb950;border-color:#2ea04366}.nb-badge.no{color:#f85149;border-color:#f8514966}
  .nb-first{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(63,185,80,.14);color:#3fb950;font-weight:700}
.who-ic{display:inline-flex;width:18px;height:18px;cursor:help;margin-top:3px}.who-ic svg{width:18px;height:18px}.who-ic.human{color:#3fb950}.who-ic.bot{color:#8b949e}.who-row{display:flex;gap:6px;align-items:center}.play-ic{display:inline-flex;width:18px;height:18px;cursor:help;margin-top:3px}.play-ic svg{width:18px;height:18px}.play-ic.yes{color:#3fb950}.play-ic.no{color:#8b949e}
.soc-icons{display:flex;gap:5px;margin-top:3px}.soc-ic{display:inline-flex;width:16px;height:16px;cursor:help}.soc-ic svg{width:16px;height:16px}.soc-ic.off{opacity:.35}
  /* kanban #2904 (the owner 2026-11-16: "Sie sollen in einem Modal oeffnen ... Es sind nun zu viele Tickets"): a report opens over the list */
  dialog#dlg { width: min(960px, calc(100vw - 24px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); }
  dialog#dlg::backdrop { background: rgba(0, 0, 0, .6); }
  #dlg .dlg-bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #dlg .dlg-bar .dim { margin-right: auto; }
  #dlg #detail { border: 0; margin: 0; }
</style>
</head>
<body>
<!-- ONE HEADER FOR EVERY PAGE (kanban #1457, the owner 2026-11-11: "Der Header muss überall gleich aussehen"): the start page's header, drawn by site-chrome.js -->
<script src="https://testnet.bitcoinarena.io/site-chrome.js" data-foot="none">
</script>
<main>
  <h1>Feedback review &middot; Bug bounty by week</h1>
  <p class="sub" data-payouts>Player reports, the reward rules and the payouts. Nothing is paid without an approval here.</p>

  <div class="panel" id="login">
    <div class="row"><input id="code" type="password" placeholder="Admin code" autocomplete="off" aria-label="Admin code">
      <button class="go" id="enter">Open</button><span class="dim">kept in this browser only</span></div>
    <div id="loginsay" class="bad"></div>
  </div>
  <p id="wait" class="dim" hidden>Opening the reports…</p>

  <div id="app" hidden>
    <div class="panel">
      <div class="stats" id="stats"></div>
      <div class="bar" aria-hidden="true"><i id="weekbar" style="width:0"></i></div>
      <div class="dim" id="weektext"></div>
    </div>
    <div class="panel">
      <div class="row">
        <select id="f-state"><option value="">every state</option><option>new</option><option>accepted</option><option>rejected</option><option>duplicate</option><option>paid</option></select>
        <select id="f-type"><option value="">every category</option><option>bug</option><option>improvement</option></select>
        <select id="f-source"><option value="">frontend and node</option><option value="frontend">frontend</option><option value="node">node</option></select>
        <select id="f-who" aria-label="Human or bot"><option value="">humans and bots</option><option value="human">human</option><option value="bot">bot</option></select>
        <select id="f-week" aria-label="Season"><option value="">every season</option><option value="1">Season 1</option><option value="2">Season 2</option></select>
        <label class="dim"><input type="checkbox" id="f-showweek"> show season</label>
        <input id="f-game" placeholder="game" size="14"><input id="f-key" placeholder="player key (hex)" size="20">
        <button id="reload">Show</button><button id="csv">Export CSV</button><button id="logout">Forget code</button>
      </div>
      <div id="say" role="status"></div>
      <div class="scroll"><table><thead><tr><th>Received</th><th>From</th><th>Category</th><th>State</th><th class="hide-s">Game</th><th>What happened</th><th>Player</th><th>Reward</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <dialog id="dlg" aria-label="Report"><div class="dlg-bar"><span class="dim" id="dlg-pos"></span><button id="dlg-prev" title="previous report (←)">‹ Prev</button><button id="dlg-next" title="next report (→)">Next ›</button><button id="dlg-x" title="close (Esc)" aria-label="close">✕</button></div><div class="panel" id="detail" hidden></div></dialog>
  </div>
</main>
<script>
const SOCIAL_SVG = {"x": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"currentColor\" d=\"M18.9 2H22l-6.8 7.8L23 22h-6.3l-4.9-6.4L6.1 22H3l7.3-8.3L1 2h6.4l4.4 5.9L18.9 2zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20z\"/></svg>", "nostr": "<svg viewBox=\"48 44 167 167\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"#a855f7\" d=\"M210.8 199.4c0 3.1-2.5 5.7-5.7 5.7h-68c-3.1 0-5.7-2.5-5.7-5.7v-15.5c.3-19 2.3-37.2 6.5-45.5 2.5-5 6.7-7.7 11.5-9.1 9.1-2.7 24.9-.9 31.7-1.2 0 0 20.4.8 20.4-10.7s-9.1-8.6-9.1-8.6c-10 .3-17.7-.4-22.6-2.4-8.3-3.3-8.6-9.2-8.6-11.2-.4-23.1-34.5-25.9-64.5-20.1-32.8 6.2.4 53.3.4 116.1v8.4c0 3.1-2.6 5.6-5.7 5.6H57.7c-3.1 0-5.7-2.5-5.7-5.7v-144c0-3.1 2.5-5.7 5.7-5.7h31.7c3.1 0 5.7 2.5 5.7 5.7 0 4.7 5.2 7.2 9 4.5 11.4-8.2 26-12.5 42.4-12.5 36.6 0 64.4 21.4 64.4 68.7v83.2ZM150 99.3c0-6.7-5.4-12.1-12.1-12.1s-12.1 5.4-12.1 12.1 5.4 12.1 12.1 12.1S150 106 150 99.3Z\"/></svg>", "telegram": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"#229ED9\" d=\"M21.9 3.4L18.6 19c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 12.6 1 11c-1.1-.3-1.1-1.1.2-1.6L20.5 2c.9-.3 1.7.2 1.4 1.4z\"/></svg>", "discord": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"#5865F2\" d=\"M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18.2 18.2 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.4C.6 9.1-.3 13.6.2 18.1a19.8 19.8 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.7-3.5-13.7zM8.5 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z\"/></svg>", "armada": "<svg viewBox=\"20 2 88 124\" aria-hidden=\"true\" focusable=\"false\"><g fill=\"#19e6e6\"><path d=\"M95.4 104.865H32.59c-1.18 0-2.14-.96-2.14-2.14s.96-2.14 2.14-2.14H95.4c1.18 0 2.14.96 2.14 2.14s-.96 2.14-2.14 2.14z\"/><path d=\"M83.98 115.565H44.01a1.43 1.43 0 1 1 0-2.86h39.97a1.43 1.43 0 1 1 0 2.86z\"/><path d=\"M73.99 123.775H54.01a1.071 1.071 0 0 1 0-2.14h19.98a1.071 1.071 0 0 1 0 2.14z\"/></g><path fill=\"#f0388a\" d=\"M64 4.225l-39.97 88.5h17.13l2.31-5.2 2.76-6.22-2.22-1.43-1.42-12.84h9.99l4.89-11.01L64 41.335l11.42 25.7h9.99l-1.43 12.84-2.22 1.43 2.77 6.22 2.31 5.2h17.13z\"/><path fill=\"#f0388a\" d=\"M76.84 79.165c-.15 0-.31-.05-.44-.15l-12.41-9.65-12.41 9.65c-.31.24-.76.19-1-.13a.706.706 0 0 1 .13-1l12.85-9.99c.26-.2.62-.2.88 0l12.85 9.99a.715.715 0 0 1-.43 1.28z\"/></svg>"};
(() => {
  const API = '/api/faucet/feedback/admin';
  // the sats each level pays, from the faucet's own table (the list answers them): picking a level fills the amount in (the owner 2026-11-10)
  let LEVELS = [];
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === 'text') e.textContent = v; else if (k === 'cls') e.className = v; else e.setAttribute(k, v); } for (const c of kids) if (c) e.append(c); return e; };
  /* WEEK-OF */
  // THE WEEK OF A REPORT (kanban #2639): Week 2 when the season file lists it (approved or waiting), or it came at or after the end of Week 1 and is
  // still new; every other report is Week 1
  function weekOf(r, listed, s1EndMs) {
    if (listed && listed.has(r.id)) return 2;
    if (Number.isFinite(s1EndMs) && r.state === 'new' && Number(r.receivedMs) >= s1EndMs) return 2;
    return 1;
  }
  /* /WEEK-OF */
  let WEEK2 = new Set(), S1_END = null;
  try { $('f-showweek').checked = localStorage.getItem('arena.feedback.admin.showweek') === '1'; } catch { /* off */ }
  const sats = (n) => `${Number(n || 0).toLocaleString('en')} sat`;
  const when = (ms) => (ms ? new Date(ms).toISOString().slice(0, 16).replace('T', ' ') : '');
  let code = ''; try { code = localStorage.getItem('arena.feedback.admin') || ''; } catch { code = ''; }
  // OPENED FROM THE GAME'S ADMIN LINK (the owner 2026-11-10: "wenn ich auf das admin links unten klicke muss die aber die admin Seite aufgehen"): the code comes in
  // the URL fragment (#code=..., never sent to a server), is kept as a typed code is, and leaves the address bar at once
  { const m = /(?:^|[#&])code=([^&]+)/.exec(location.hash || '');
    if (m) { try { code = decodeURIComponent(m[1]).trim(); localStorage.setItem('arena.feedback.admin', code); } catch { /* this tab only */ }
      history.replaceState(history.state, '', location.pathname + location.search); } }
  const say = (t, bad = false) => { $('say').textContent = t; $('say').className = bad ? 'bad' : 'dim'; };
  async function call(path, body) {
    const r = await fetch(`${API}/${path}`, body ? { method: 'POST', headers: { 'content-type': 'application/json', 'x-arena-admin': code }, body: JSON.stringify(body) } : { headers: { 'x-arena-admin': code } });
    if (r.status === 403) { show(false); throw new Error('not the admin code'); }
    return r.json();
  }
  function show(on) { $('wait').hidden = true; $('login').hidden = on; $('app').hidden = !on; }
  // WHILE THE LIST LOADS (the owner 2026-11-10: "this screen is there for quite a while until it loads the real list, it seems it is stuck"): the
  // login form left up looked like the code was not taken; now a plain "Opening the reports…", and a failure shows on the login, not in the hidden list
  const fail = (t) => { $('wait').hidden = true; if ($('app').hidden) { $('login').hidden = false; $('loginsay').textContent = t; } else say(t, true); };
  function budget(b) {
    const s = $('stats'); s.replaceChildren();
    const stat = (label, v) => el('div', { cls: 'stat' }, el('b', { text: v }), el('span', { text: label }));
    // EVERYTHING THIS WEEK APPROVED, IN ONE FIGURE (the owner 2026-11-12: "die bug bounties haben erst gestern begonnen und es war alles die selbe
    // Woche. Es muss deckungsgleich sein"): the week's figure counts every approval of the last 7 days - with this week's whole history it equals
    // "approved in all". The critical and node part is named under it: by the rule it never blocks another approval (outside the budget)
    const weekAll = Number(b.weekPaidSats ?? b.weekApprovedSats ?? 0);   // paid this week (the owner 2026-11-12: "Das ist was diese Woche ausgezahlt wurde")
    s.append(stat('paid in the last 7 days', `${sats(weekAll)} of ${sats(b.weeklyBudgetSats)}`),
      stat('approved, all weeks', sats(b.allApprovedSats)), stat('paid, all weeks', sats(b.paidSats)),
      stat('links not yet claimed', `${b.openRewards.n} · ${sats(b.openRewards.s)}`),
      // kanban #2287: links being paid on their own line (void links are in neither)
      ...(b.payingRewards && b.payingRewards.n ? [stat('links being paid', `${b.payingRewards.n} · ${sats(b.payingRewards.s)}`)] : []), stat('new reports', String((b.counts && b.counts.new) || 0)));
    $('weekbar').style.width = `${Math.min(100, (100 * weekAll) / Math.max(1, b.weeklyBudgetSats))}%`;
    // REAL SATS ON MAINNET (kanban #1450, the owner 2026-11-11: bounties are real Lightning payments on mainnet): said by the faucet's payout network
    $('weektext').textContent = (b.network === 'mainnet' ? 'Mainnet sats: real money, paid over Lightning from the bounty wallet.' : 'Testnet sats, no value.') + ' The weekly budget and the per-player limit are the faucet\'s reward rules.';
    const sub = document.querySelector('p.sub[data-payouts]'); if (sub) sub.textContent = `Player reports, the reward rules and the ${b.network === 'mainnet' ? 'mainnet Lightning' : 'testnet'} payouts. Nothing is paid without an approval here.`;
  }
  // ONLY THE NEWEST READ DRAWS (kanban #2904, the owner's screenshot 2026-11-16: state "accepted" + Season 2 listed "new" reports): picking the season
  // starts a read at once, Show another - the older one, answered later, drew its unfiltered list over the filtered one
  let LOADS = 0;
  async function load() {
    const me = ++LOADS;
    const q = new URLSearchParams(); for (const [k, id] of [['state', 'f-state'], ['type', 'f-type'], ['source', 'f-source'], ['game', 'f-game'], ['pubkey', 'f-key']]) if ($(id).value.trim()) q.set(k, $(id).value.trim());
    // the old rows go at once (kanban #2904: a slow read left the last list on screen under the new filter, read as "the filter does nothing")
    say('Reading…'); $('rows').replaceChildren();
    if ($('app').hidden) { $('login').hidden = true; $('loginsay').textContent = ''; $('wait').hidden = false; }
    let j; try { j = await call(`list?${q}`); } catch (e) { return me === LOADS ? fail(e.message) : undefined; }
    if (me !== LOADS) return;
    if (!j.ok) return fail(j.why || 'not read');
    show(true); budget(j.budget); if (Array.isArray(j.levels)) LEVELS = j.levels;
    // WHICH REPORTS ARE WEEK 2 (kanban #2639): the season file's approvals, waiting included, and the end of Week 1; read with the list
    try { const w = await call('season'); if (w && w.ok) { WEEK2 = new Set([...(w.approvals || []), ...(w.waiting || [])].map((a) => a.report)); S1_END = Number.isFinite(w.s1EndMs) ? w.s1EndMs : null;
      // THE SEASON'S POT AS IT REALLY STANDS (kanban #2784, the owner 2026-11-15: "zeig das auch korrekt an"): paid, else payable under the current rule
      if (w.pot && Number(w.pot.potSats) > 0) { $('stats').querySelectorAll('.stat.pot').forEach((x) => x.remove());
        const st = el('div', { cls: 'stat pot' }, el('b', { text: `${sats(w.pot.usedSats)} used · ${sats(w.pot.leftSats)} left` }), el('span', { text: `Season ${w.pot.season} pot of ${sats(w.pot.potSats)} (paid, else payable now)` }));
        $('stats').prepend(st);
        // THE DRAW PRIZE, ITS OWN FIGURE (kanban #2784, the owner 2026-11-15): not part of the bounty pot
        if (Number(w.pot.drawPrizeSats) > 0) { const dp = el('div', { cls: 'stat pot' }, el('b', { text: sats(w.pot.drawPrizeSats) }), el('span', { text: `Draw prize, Season ${w.pot.season} (apart from the pot)` })); st.after(dp); } } } }
    catch { WEEK2 = new Set(j.reports.filter((r) => r.season2 && r.season2.approval).map((r) => r.id)); }
    if (me !== LOADS) return;
    const wantWeek = Number($('f-week').value) || 0, showWeek = $('f-showweek').checked;
    const tb = $('rows'); tb.replaceChildren();
    let shown = 0, humans = 0; const wantWho = $('f-who').value; SHOWN = [];
    for (const r of j.reports) {
      const wk = weekOf(r, WEEK2, S1_END);
      if (wantWeek && wk !== wantWeek) continue;
      const hum = isHuman(r);
      if (wantWho && (wantWho === 'human') !== hum) continue;
      shown++; if (hum) humans++; SHOWN.push(r.id);
      const who = el('td', {}, el('code', { text: `${r.pubkey.slice(0, 12)}…` }), r.ours ? el('div', { cls: 'warn', text: 'ours' }) : null,
        // kanban #2875: the owner's "real user" mark on this key; kanban #2904: beside it whether the reporter played (replaces the pill and the red text)
        el('div', { cls: 'who-row' }, humanIcon(r), playedIcon(r)),
        // the owner's played mark is said in the icon's tooltip and the report, no pill here (kanban #2904, the owner 2026-11-16)
        socialIcons(r),
        // HOW MUCH AND WHAT (the owner 2026-11-10: "wieviel runden der spieler gemacht hat und welche apps er genutzt hat")
        r.rounds && r.rounds.rounds ? el('div', { cls: 'dim', text: `${r.rounds.rounds} rounds · ${r.rounds.games.map(([g, n]) => `${g} ${n}`).join(', ')}` }) : null);
      // FRONTEND OR NODE (the owner 2026-11-07: "in der admin ui wird angezeigt ob es frontend oder node war")
      // THE ONE-TIME NODE BOUNTY SEEN IN THE LIST (kanban #1453, the owner 2026-11-11: "damit ich das sehe dass er 10k kriegt, weil es sein erstes ticket ist")
      const nbFirst = r.nodeBounty && r.nodeBounty.first && r.state === 'new';
      const from = el('td', {}, el('span', { cls: `tag ${r.source === 'node' ? 's-accepted' : 's-new'}`, text: r.source === 'node' ? 'node' : 'frontend' }), r.node ? el('div', {}, el('code', { text: `${r.node.slice(0, 10)}…` })) : null,
        nbFirst ? el('div', {}, el('span', { cls: 'tag s-paid', text: `+${sats(r.nodeBounty.sats)} first node feedback` })) : null);
      const tr = el('tr', { cls: 'pick' }, el('td', {}, el('b', { text: r.label || '' }), el('div', { cls: 'dim', text: when(r.receivedMs) }), showWeek ? el('div', {}, el('span', { cls: `tag ${wk === 2 ? 's-accepted' : 's-new'}`, text: `Season ${wk}` })) : null), from,
        // its number (kanban #1413) heads the first cell; CATEGORY AND STATE are their own cells (the owner 2026-11-10: "The table is off" - a comment
