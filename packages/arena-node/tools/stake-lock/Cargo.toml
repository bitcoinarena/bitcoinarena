# THE STAKE LOCK, BUILT BY THE PLAYER'S OWN CLIENT (FEDERATION.md, rehearsal
# step 1). It builds only as a member of a fedimint v0.12.0 source tree, whose
# workspace pins every dependency; nothing here does that for you. As built
# for the measurement (2026-09-11):
#
#   ln -s <this directory> <fedimint-0.12.0>/arena-stake-lock
#   add "arena-stake-lock" to <fedimint-0.12.0>/Cargo.toml [workspace] members
#   cargo build --release -p arena-stake-lock      (rocksdb needs libclang:
#     LIBCLANG_PATH, and BINDGEN_EXTRA_CLANG_ARGS=-I<llvm>/lib/clang/<v>/include)
#
# then hand the binary to tools/stake-lock-step1.sh as LOCK_BIN. Client code
# only, on the stock client crates - fedimintd is the released, unpatched build.
[package]
name = "arena-stake-lock"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# THE ARENA LOCK (kanban #1044 B1, src/arena.rs): only against the fork branch whose fedimint-lnv2-common carries arena_lock
# (module consensus version 1.100); `cargo build --release -p arena-stake-lock --features arena-lock`
arena-lock = []

[dependencies]
anyhow = { workspace = true }
bitcoincore-rpc = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-bitcoind = { workspace = true, features = ["bitcoincore"] }
fedimint-bip39 = { workspace = true }
fedimint-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-ln-client = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-lnv2-common = { workspace = true }
lightning-invoice = { workspace = true }
tpe = { workspace = true }
fedimint-meta-client = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-mintv2-client = { workspace = true }
fedimint-rocksdb = { workspace = true }
fedimint-wallet-client = { workspace = true }
futures = { workspace = true }
fedimint-walletv2-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tbs = { workspace = true }
tokio = { workspace = true, features = ["full"] }
