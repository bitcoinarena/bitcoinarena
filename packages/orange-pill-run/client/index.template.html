<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orange Pill Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one screen. Title row, the pixel-art playfield filling the rest (HUD drawn inside), touch buttons on touch screens; start and result cards sit over the playfield. Single dark look. */
:root {
  color-scheme: dark;
  --bg: #0f0a10; --panel: #1c151e; --line: #46343f; --text: #f6ece4; --soft: #c8bab2; --dim: #8c8086;
  --btc: #f7931a; --gold: #ffd166; --ink: #1e1208; --blue: #58a6ff; --green: #3fb950; --red: #f85149;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
/* a game screen: no text selection, no long-press menu, no tap flash, no double-tap zoom (iOS) */
html, body, #stage, #pad, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
body.playing { touch-action: none; }
.box, .box * { -webkit-user-select: text; user-select: text; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body); box-sizing: border-box; margin: 0;   /* #3251: the default 8 px margin made the frame scroll */
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; width: 100%; }
h1 { font-family: var(--display); font-size: 1.4rem; margin: 0; }
header p { margin: 0; color: var(--soft); font-size: .85rem; min-width: 0; }
.tag { margin-left: auto; font-family: var(--display); font-size: .68rem; letter-spacing: .08em; color: var(--dim); border: 1px solid var(--dim); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
#stage { flex: 1; min-height: 0; width: 100%; position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #0d0a1e; }
#cv { display: block; position: absolute; inset: 0; touch-action: none; }
.sheet { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: auto; background: rgba(10,6,14,.55); }
.box { background: rgba(28,21,30,.97); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(540px, 100%); box-sizing: border-box; box-shadow: 0 12px 50px rgba(0,0,0,.6); }
.box h2 { font-family: var(--display); margin: 0 0 6px; font-size: 1.6rem; text-wrap: balance; }
.box p { margin: 0 0 10px; color: var(--soft); font-size: 1rem; line-height: 1.5; }
.box .keys { color: var(--dim); font-size: .85rem; }
.price { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 0 0 10px; font-family: var(--display); }
.price b { font-size: 1.3rem; } .price .dn { color: var(--red); } .price .up { color: var(--green); } .price small { color: var(--dim); font-family: var(--body); font-size: .8rem; }
.eyebrow { font-family: var(--display); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--btc); margin: 14px 0 6px; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; font-variant-numeric: tabular-nums; }
th { color: var(--dim); font-weight: 400; font-size: .75rem; text-align: right; padding: 3px 6px; }
td { text-align: right; padding: 5px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td:first-child { white-space: normal; }   /* kanban #3251: a long label wraps; the numbers stay in view on a phone */
td i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
tr.me td { background: #3c240e; }
td.tot { font-family: var(--display); font-weight: 700; color: var(--gold); }
.tw { overflow-x: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
button { font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 18px; cursor: pointer; touch-action: manipulation; }
button.primary { background: var(--btc); color: var(--ink); border-color: var(--btc); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#pad { display: grid; grid-template-columns: 1fr; width: 100%; max-width: 560px; }
#pad button { padding: 16px 0; font-size: 1.3rem; user-select: none; -webkit-user-select: none; }
#pad button.held { background: var(--line); }
#pad .jump { background: var(--btc); color: var(--ink); border-color: var(--btc); }
#pad .jump.held { background: var(--gold); }
@media (hover: hover) and (pointer: fine) { #pad { display: none; } }
@media (max-width: 600px) { header p { display: none; } }
/* kanban #3251: the intro, result, leaderboard, rules and replay screens; #3265: the entry's line while the run goes on */
body:not(.playing) #pad, body.replaying #pad { display: none; }
.wal { font-family: var(--display); font-size: .78rem; color: var(--soft); white-space: nowrap; }
.wal b { color: var(--gold); }
.box.intro h2 { font-size: 1.5rem; margin: 0 0 2px; }
.box .line { font-size: .98rem; margin: 0 0 10px; color: var(--soft); }
.bounty { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--gold); margin: 0 0 10px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; margin: 0 0 12px; }
.facts div { min-width: 0; } .facts .wide { grid-column: 1 / -1; }
.facts dt { font-size: .72rem; color: var(--dim); margin: 0; }
.facts dd { margin: 1px 0 0; font-size: .95rem; color: var(--text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
button.big { width: 100%; padding: 14px 18px; font-size: 1.1rem; }
button:disabled { opacity: .5; cursor: default; }
.why { min-height: 1.2em; margin: 8px 0 0 !important; font-size: .88rem !important; color: var(--soft); }
.links { display: flex; gap: 16px; margin-top: 10px; font-size: .92rem; }
.links a, a.lk { color: var(--btc); text-decoration: none; } .links a:hover, a.lk:hover { text-decoration: underline; }
.entry { font-size: .95rem !important; font-weight: 600; margin: 0 0 8px !important; }
.entry.ok { color: var(--green) !important; } .entry.bad { color: var(--red) !important; } .entry.wait { color: var(--gold) !important; }
.facts2 { margin: 10px 0 0; display: grid; gap: 3px; font-size: .95rem; color: var(--soft); }
.facts2 b { color: var(--text); }
.xbox { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--btc); border-radius: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.xline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px !important; font-size: .92rem !important; color: var(--soft); }
.xline button { padding: 5px 12px; font-size: .88rem; border-color: var(--btc); color: var(--btc); }
.xbox span { color: var(--text); font-size: .93rem; } .xbox button { padding: 7px 12px; font-size: .9rem; }
/* kanban #3250: the Lightning address for prizes, one compact row on the intro and the result */
.lnrow { display: flex; gap: 8px; margin: 0 0 10px; }
.lnrow input { flex: 1; min-width: 0; font: 16px/1.2 var(--body); color: var(--text); background: #120d14; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }   /* 16 px: iOS does not zoom */
.lnrow input:focus { outline: none; border-color: var(--btc); }
.lnrow button { padding: 6px 14px; font-size: .9rem; border-color: var(--btc); color: var(--btc); }
.lnwhy { margin: -6px 0 8px !important; font-size: .8rem !important; color: var(--soft); } .lnwhy.ok { color: var(--green) !important; } .lnwhy.bad { color: var(--red) !important; }
#result .lnrow { margin: 10px 0 6px; } #result .lnwhy { margin: 0 0 6px !important; }
.rules ol { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; color: var(--soft); font-size: .92rem; line-height: 1.4; }
.rules ol b { color: var(--text); }
.box.wide { width: min(620px, 100%); max-height: 100%; overflow: auto; }
td button.rp { padding: 3px 8px; font-size: .8rem; border-radius: 7px; }
#rbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(28,21,30,.92); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
#rbar button { padding: 8px 14px; font-size: .95rem; }
#rbar button[aria-pressed="true"] { border-color: var(--btc); color: var(--btc); }
#pill { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); max-width: calc(100% - 20px); box-sizing: border-box; font-size: .8rem; color: var(--text);
  background: rgba(28,21,30,.85); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pill.ok { border-color: var(--green); } #pill.bad { border-color: var(--red); } #pill.wait { border-color: var(--gold); }
/* in the Arena's frame the page's bar carries the name: the header is one line, the wallet and the round */
body.bridged header h1, body.bridged header p { display: none; }
body.bridged header { justify-content: space-between; }
body.bridged .tag { margin-left: 0; }
/* kanban #3251 (owner 2026-11-22, iPhone): the intro fits the frame with no scrollbar. The three short facts stay one row; short frames
   (a phone with its browser bars: the frame is the screen less the bars and the Arena's 41 + 30 px) get tighter type and spacing. If a
   frame is smaller still, only the sheet scrolls, without a visible bar. */
.facts .f3 dd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet { scrollbar-width: none; } .sheet::-webkit-scrollbar { display: none; }
@media (max-height: 700px) {
  body { padding-block: 8px; gap: 8px; }
  .box { padding: 14px 16px; } .box.intro h2 { font-size: 1.3rem; }
  .box .line { font-size: .92rem; line-height: 1.35; margin: 0 0 8px; }
  .bounty { font-size: 1.02rem; margin: 0 0 8px; }
  .facts { gap: 4px 10px; margin: 0 0 10px; } .facts dd { font-size: .92rem; }
  .xline { margin: 0 0 8px !important; } .lnrow { margin: 0 0 8px; } .lnrow input { padding: 6px 10px; } button.big { padding: 12px 16px; font-size: 1.05rem; }
  .why { margin: 6px 0 0 !important; } .links { margin-top: 8px; }
}
@media (max-height: 560px) {
  .sheet { padding: 6px; } .box { padding: 12px 14px; } .box.intro h2 { font-size: 1.15rem; }
  .box .line { font-size: .85rem; margin: 0 0 6px; } .bounty { font-size: .95rem; margin: 0 0 6px; }
  .facts { gap: 2px 10px; margin: 0 0 8px; } .facts dt { font-size: .68rem; } .facts dd { font-size: .86rem; }
  .xline { margin: 0 0 6px !important; font-size: .85rem !important; } .xline button { padding: 3px 10px; }
  .lnrow { margin: 0 0 6px; } .lnrow input { padding: 5px 9px; } .lnrow button { padding: 4px 12px; }
  button.big { padding: 10px 14px; font-size: 1rem; } .why { font-size: .8rem !important; } .links { margin-top: 6px; font-size: .86rem; }
}
/* kanban #3251: the faucet's top-up under the reason, when the wallet cannot pay the entry and its fee */
.whyrow { display: flex; align-items: center; gap: 10px; } .whyrow .why { flex: 1; min-width: 0; }
.topup { flex: none; margin-top: 6px; padding: 6px 12px; font-size: .86rem; border-color: var(--green); color: var(--green); white-space: nowrap; }
/* kanban #3251 (owner 2026-11-22): the daily prize, right under the title line, in the orange accent; "no play bounty" small */
.prize { margin: 0 0 8px !important; color: var(--btc) !important; font-family: var(--display); line-height: 1.3 !important; }
.prize b { font-size: 1.05rem; } .prize small { font-family: var(--body); font-size: .78rem; color: var(--soft); font-weight: 400; }
.prize.rp { font-weight: 700; font-size: .95rem !important; margin: 8px 0 0 !important; }
.bounty.small { font-size: .8rem !important; font-weight: 400; color: var(--dim); margin: -4px 0 8px !important; }
@media (max-width: 400px) { .prize b { font-size: .98rem; } }
@media (max-height: 700px) { .prize { margin: 0 0 6px !important; } .prize b { font-size: .95rem; } }
/* kanban #3251 (owner 2026-11-22): eligible in green, not eligible in red - with its button and field right there */
.xline.ok { color: var(--green) !important; } .xline.bad { color: var(--red) !important; font-weight: 600; }
.notcounted { margin: 6px 0 0 !important; font-size: .88rem !important; color: var(--red) !important; font-weight: 600; line-height: 1.35 !important; }
/* kanban #3251: the speaker toggle in the header (music + effects, effects only, off) */
.snd { font-size: .72rem; padding: 3px 10px; border-radius: 99px; font-weight: 600; color: var(--soft); white-space: nowrap; }
body.bridged .snd { margin-left: auto; } body:not(.bridged) .snd { margin-left: auto; } body:not(.bridged) .tag { margin-left: 0; }
/* kanban #3251 (owner 2026-11-22): the top 10 on the intro, compact rows; on a short frame only this list scrolls, never the page */
.iboard { margin: 0 0 10px; max-height: min(16.5rem, 34vh); overflow-y: auto; scrollbar-width: thin; border: 1px solid var(--line); border-radius: 10px; }
.iboard table { font-size: .84rem; }
.iboard td { padding: 2px 8px; border-top: 1px solid rgba(70,52,63,.55); line-height: 1.25; }
.iboard tr:first-child td { border-top: 0; }
/* the intro never outgrows its frame: it is a column as tall as the sheet at most, and the board is the one part that gives way (and scrolls) */
.box.intro { display: flex; flex-direction: column; max-height: 100%; } .box.intro > * { flex: none; } .box.intro > .iboard { flex: 0 1 auto; min-height: 4.6rem; }
.iboard td.rk { width: 1.8em; color: var(--dim); } .iboard td.nm { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9.5em; }
.iboard tr.gap td { border-top: 2px dashed var(--dim); }
.iboard .iempty { margin: 6px 10px !important; font-size: .88rem !important; }
@media (max-height: 700px) { .iboard { margin: 0 0 8px; max-height: min(15rem, 25vh); } .iboard td { padding: 1px 8px; } }
@media (max-width: 400px) { .bounty { font-size: .95rem !important; line-height: 1.3 !important; } }
@media (max-height: 560px) { .iboard { max-height: 24vh; } .iboard table { font-size: .8rem; } }
</style>

<header>
  <h1>Orange Pill Run</h1>
  <p>Run across the last 24 hours of the Bitcoin chart. Every candle is a platform.</p>
  <span class="wal" id="wal" hidden></span>
  <button class="snd" id="sndBtn" type="button">♪ on</button>
  <span class="tag" id="modeTag">OFFLINE · PRACTICE</span>
</header>

<div id="stage">
  <canvas id="cv" aria-label="Game"></canvas>
  <div class="sheet" id="intro">
    <div class="box intro">
      <h2>Orange Pill Run</h2>
      <p class="line" id="iLine">Run yesterday's Bitcoin chart. Tap to jump. Don't fall.</p>
      <p class="prize" id="iPrize" hidden><b id="iPrizeText"></b><small id="iPrizeSmall"></small></p>
      <p class="bounty small" id="iBounty" hidden></p>
      <p class="xline" id="iX" hidden><span id="iXText"></span><button id="iXBtn" type="button" hidden>Link X</button></p>
      <form class="lnrow" id="iLn" hidden><input id="iLnIn" type="text" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="320" placeholder="Lightning address for prizes" aria-label="Lightning address for prizes"><button id="iLnBtn" type="submit">Save</button></form>
      <p class="lnwhy" id="iLnWhy" role="status" hidden></p>
      <dl class="facts" id="iFacts" hidden></dl>
      <div class="iboard" id="iBoard" hidden><p class="iempty" id="iBEmpty" hidden></p><table id="iBTable"></table></div>
      <div class="price" id="iPrice"></div>
      <button class="primary big" id="startBtn">Practice run (free)</button>
      <div class="whyrow"><p class="why" id="iWhy" role="status"></p><button class="topup" id="iTopUp" type="button" hidden>Get 300 free sats</button></div>
      <nav class="links"><a href="#rules" id="rulesLink">Rules</a><a href="#board" id="boardLink">Leaderboard</a></nav>
    </div>
  </div>
  <div class="sheet" id="result" hidden>
    <div class="box">
      <h2 id="rTitle"></h2>
      <p class="entry" id="rEntry" role="status"></p>
      <div class="tw"><table id="rScore"></table></div>
      <p class="refused" id="rRefused" hidden></p>
      <p class="prize rp" id="rPrize" hidden></p>
      <p class="notcounted" id="rNot" hidden></p>
      <div class="facts2" id="rFacts"><span id="rRank"></span><span id="rBeat"></span><span id="rLeft"></span></div>
      <form class="lnrow" id="rLn" hidden><input id="rLnIn" type="text" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="320" placeholder="Lightning address for prizes" aria-label="Lightning address for prizes"><button id="rLnBtn" type="submit">Save</button></form>
      <p class="lnwhy" id="rLnWhy" role="status" hidden></p>
      <div class="xbox" id="rX" hidden><span id="rXText">Link your X account to be placed and win.</span><button id="xBtn" type="button">Link X</button></div>
      <div class="row"><button class="primary" id="againBtn">Play again</button><button id="replayBtn">Watch replay</button><button id="rBoardBtn">Leaderboard</button></div>
    </div>
  </div>
  <div class="sheet" id="board" hidden>
    <div class="box wide">
      <h2>Leaderboard</h2>
      <p id="bLine"></p>
      <div class="tw"><table id="bTable"></table></div>
      <div class="row"><button class="primary" id="bBack">Back</button></div>
    </div>
  </div>
  <div class="sheet" id="rules" hidden>
    <div class="box wide rules">
      <h2 id="rulesTitle">Rules</h2>
      <ol id="rulesList"></ol>
      <div class="row"><button class="primary" id="rulesBack">Back</button><a class="lk" id="rulesPage" href="rules.html" target="_blank" rel="noopener" style="align-self:center">Rules page</a></div>
    </div>
  </div>
  <div id="rbar" hidden><button id="rbPlay" type="button">Pause</button><button id="rb2x" type="button" aria-pressed="false">2x</button><button id="rbClose" type="button">Close</button></div>
  <div id="pill" hidden role="status"></div>
</div>

<div id="pad">
  <button id="pJ" class="jump" aria-label="Jump">JUMP</button>
</div>
